<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff7ec">
<title>PIN Practice</title>
<style>
  :root
  {
    --bg: #fff7ec;
    --ink: #24314d;
    --muted: #6b7590;
    --card: #ffffff;
    --key-border: #e7ddca;
    --key-shadow: #e4d8bf;
    --accent: #2f9e6e;
    --accent-ink: #ffffff;
    --wrong: #e2574c;
    --focus: #3b82c4;
  }

  * { box-sizing: border-box; }

  html, body
  {
    margin: 0;
    height: 100%;
  }

  body
  {
    background: var(--bg);
    color: var(--ink);
    font-family: "Baloo 2", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }

  #confetti
  {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9999;
  }

  .app
  {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: clamp(14px, 3.5vh, 34px);
    padding: clamp(16px, 4vh, 40px) 18px calc(env(safe-area-inset-bottom, 0px) + 24px);
    max-width: 480px;
    margin: 0 auto;
  }

  header
  {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  h1
  {
    margin: 0;
    font-size: clamp(1.5rem, 6vw, 2rem);
    letter-spacing: 0.5px;
  }

  .icon-btn
  {
    appearance: none;
    border: 2px solid var(--key-border);
    background: var(--card);
    color: var(--ink);
    width: 52px;
    height: 52px;
    border-radius: 16px;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 3px 0 var(--key-shadow);
  }

  .icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-shadow); }

  .dots
  {
    display: flex;
    gap: clamp(10px, 3vw, 18px);
    padding: 6px 0;
  }

  .dot
  {
    position: relative;
    width: clamp(20px, 6vw, 30px);
    height: clamp(20px, 6vw, 30px);
    border-radius: 50%;
    border: 3px solid var(--key-border);
    background: transparent;
    transition: transform 120ms ease, background-color 120ms ease, border-color 120ms ease;
  }

  .dot__num
  {
    position: absolute;
    top: calc(100% + 22px);
    left: 50%;
    transform: translateX(-50%);
    font-weight: 800;
    font-size: clamp(1.2rem, 6vw, 1.7rem);
    line-height: 1;
    color: var(--ink);
    opacity: 0;
    pointer-events: none;
    transition: opacity 120ms ease;
  }

  .dots--peek .dot__num { opacity: 1; }

  .dot--filled { background: var(--ink); border-color: var(--ink); transform: scale(1.05); }
  .dot--win.dot--filled { background: var(--accent); border-color: var(--accent); }
  .dot--wrong.dot--filled { background: var(--wrong); border-color: var(--wrong); }

  .shake { animation: shake 0.45s ease; }

  @keyframes shake
  {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .message
  {
    margin: 0;
    min-height: 1.4em;
    font-size: clamp(1rem, 4vw, 1.2rem);
    font-weight: 700;
    color: var(--muted);
    text-align: center;
    transition: color 120ms ease, font-size 120ms ease, letter-spacing 120ms ease;
  }


  .keypad
  {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(10px, 2.6vw, 16px);
    width: 100%;
  }

  .key
  {
    appearance: none;
    border: 2px solid var(--key-border);
    background: var(--card);
    color: var(--ink);
    font-family: inherit;
    font-weight: 800;
    font-size: clamp(1.6rem, 7vw, 2.4rem);
    aspect-ratio: 1 / 1;
    border-radius: 22px;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 5px 0 var(--key-shadow);
    transition: transform 80ms ease, box-shadow 80ms ease, background-color 80ms ease;
  }

  .key:active
  {
    transform: translateY(4px);
    box-shadow: 0 1px 0 var(--key-shadow);
    background: #f3ffe9;
  }

  .key--action
  {
    font-size: clamp(1rem, 4.4vw, 1.3rem);
    color: var(--muted);
  }

  .restart
  {
    appearance: none;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: inherit;
    font-weight: 800;
    font-size: clamp(1.05rem, 4.5vw, 1.3rem);
    padding: 16px 28px;
    border-radius: 999px;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 5px 0 #24805a;
  }

  .restart:active { transform: translateY(3px); box-shadow: 0 2px 0 #24805a; }

  .restart--ghost
  {
    background: transparent;
    color: var(--muted);
    box-shadow: none;
    font-size: 1rem;
    padding: 8px 16px;
  }

  .restart--ghost:active { transform: none; }

  .footer-actions
  {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  #hintBtn
  {
    touch-action: none;
    border: 2px dashed var(--key-border);
  }

  #hintBtn:active { background: rgba(47, 158, 110, 0.12); }

  [hidden] { display: none !important; }

  /* Celebration overlay */
  .celebrate
  {
    position: fixed;
    inset: 0;
    z-index: 9000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(255, 247, 236, 0.82);
    backdrop-filter: blur(2px);
  }

  .celebrate__card
  {
    background: var(--card);
    border: 3px solid var(--key-border);
    border-radius: 28px;
    padding: 30px 28px;
    text-align: center;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(36, 49, 77, 0.18);
    animation: pop 0.4s cubic-bezier(0.18, 1.4, 0.4, 1);
  }

  @keyframes pop
  {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .celebrate__emoji
  {
    font-size: 4rem;
    line-height: 1;
    animation: bounce 0.9s ease infinite alternate;
  }

  @keyframes bounce
  {
    from { transform: translateY(0) rotate(-6deg); }
    to { transform: translateY(-14px) rotate(6deg); }
  }

  .celebrate__card h2
  {
    margin: 12px 0 4px;
    font-size: 1.9rem;
    color: var(--accent);
    letter-spacing: 0.5px;
  }

  .celebrate__card p
  {
    margin: 0 0 22px;
    font-size: 1.15rem;
    color: var(--muted);
    font-weight: 700;
  }

  /* Settings modal */
  .modal
  {
    position: fixed;
    inset: 0;
    z-index: 9500;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(36, 49, 77, 0.45);
  }

  .modal__card
  {
    background: var(--card);
    border-radius: 24px;
    padding: 26px 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
  }

  .modal__card h2 { margin: 0 0 6px; font-size: 1.4rem; }

  .modal__card > p
  {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 0.98rem;
    line-height: 1.4;
    font-weight: 600;
  }

  .modal label
  {
    display: block;
    font-weight: 800;
    font-size: 0.95rem;
    margin-bottom: 14px;
  }

  .modal input
  {
    display: block;
    width: 100%;
    margin-top: 6px;
    font-family: inherit;
    font-size: 1.7rem;
    font-weight: 800;
    letter-spacing: 0.4em;
    text-align: center;
    padding: 12px 10px;
    border: 2px solid var(--key-border);
    border-radius: 14px;
    background: #ffffff;
    color: #10192e;
    -webkit-text-fill-color: #10192e;
    caret-color: #10192e;
  }

  .modal input::placeholder
  {
    color: #9aa4c0;
    -webkit-text-fill-color: #9aa4c0;
  }

  .modal input:focus
  {
    outline: 3px solid var(--focus);
    outline-offset: 1px;
    border-color: var(--focus);
  }

  .settings-msg
  {
    min-height: 1.3em;
    margin: 4px 0 14px;
    color: var(--wrong);
    font-weight: 700;
    font-size: 0.95rem;
  }

  .settings-msg[data-ok="1"] { color: var(--accent); }

  .modal__actions
  {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
  }

  .btn
  {
    appearance: none;
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-weight: 800;
    font-size: 1rem;
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
    touch-action: manipulation;
  }

  .btn--ghost
  {
    background: transparent;
    color: var(--muted);
    border: 2px solid var(--key-border);
  }

  .btn:active { transform: translateY(2px); }

  @media (prefers-color-scheme: dark)
  {
    :root
    {
      --bg: #1d2333;
      --ink: #eef1f8;
      --muted: #9aa4c0;
      --card: #2a3145;
      --key-border: #3a4258;
      --key-shadow: #161b28;
      --focus: #6ea8e0;
    }
    .key:active { background: #313a52; }
    .celebrate { background: rgba(29, 35, 51, 0.85); }
  }
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<main class="app">
  <header>
    <h1>PIN Practice</h1>
    <button id="settingsBtn" class="icon-btn" type="button" aria-label="Parent settings" title="Parent settings">&#9881;&#65039;</button>
  </header>

  <div id="dots" class="dots" role="img" aria-label="PIN entry progress"></div>
  <p id="message" class="message" aria-live="polite"></p>

  <div id="keypad" class="keypad">
    <button class="key" type="button" data-key="1">1</button>
    <button class="key" type="button" data-key="2">2</button>
    <button class="key" type="button" data-key="3">3</button>
    <button class="key" type="button" data-key="4">4</button>
    <button class="key" type="button" data-key="5">5</button>
    <button class="key" type="button" data-key="6">6</button>
    <button class="key" type="button" data-key="7">7</button>
    <button class="key" type="button" data-key="8">8</button>
    <button class="key" type="button" data-key="9">9</button>
    <button class="key key--action" type="button" data-key="clear" aria-label="Clear all">Clear</button>
    <button class="key" type="button" data-key="0">0</button>
    <button class="key key--action" type="button" data-key="back" aria-label="Delete last digit">&#9003;</button>
  </div>

  <div class="footer-actions">
    <button id="hintBtn" class="restart restart--ghost" type="button" aria-label="Hold to peek at the PIN">👁 Hold to peek</button>
    <button id="restartBtn" class="restart restart--ghost" type="button">Start over</button>
  </div>
</main>

<div id="celebrate" class="celebrate" hidden>
  <div class="celebrate__card">
    <div class="celebrate__emoji">&#127881;</div>
    <h2>YOU DID IT!</h2>
    <p id="celebrateLine">You know your PIN!</p>
    <button id="againBtn" class="restart" type="button">Practice Again</button>
  </div>
</div>

<div id="settings" class="modal" hidden>
  <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">Parent Settings</h2>
    <p>Set the 6-digit PIN your child should practice. It is stored only on this device and never shown here.</p>
    <label>New PIN
      <input id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="------">
    </label>
    <label>Confirm PIN
      <input id="pinConfirm" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="------">
    </label>
    <p id="settingsMsg" class="settings-msg" aria-live="polite"></p>
    <div class="modal__actions">
      <button id="settingsCancel" class="btn btn--ghost" type="button">Cancel</button>
      <button id="settingsSave" class="btn" type="button">Save PIN</button>
    </div>
  </div>
</div>

<script>
(function ()
{
  "use strict";

  var STORE_KEY = "pinPractice.target.v1";
  var DEFAULT_PIN = "123456";
  var LEN = 6;

  var dotsEl = document.getElementById("dots");
  var msgEl = document.getElementById("message");
  var keypadEl = document.getElementById("keypad");
  var restartBtn = document.getElementById("restartBtn");
  var hintBtn = document.getElementById("hintBtn");
  var celebrateEl = document.getElementById("celebrate");
  var celebrateLine = document.getElementById("celebrateLine");
  var againBtn = document.getElementById("againBtn");
  var settingsBtn = document.getElementById("settingsBtn");
  var settingsEl = document.getElementById("settings");
  var pinInput = document.getElementById("pinInput");
  var pinConfirm = document.getElementById("pinConfirm");
  var settingsMsg = document.getElementById("settingsMsg");
  var settingsSave = document.getElementById("settingsSave");
  var settingsCancel = document.getElementById("settingsCancel");

  var entry = "";
  var locked = false;
  var peeking = false;

  var WIN_LINES = [
    "You know your PIN!",
    "You remembered every number!",
    "That was perfect!",
    "Your brain is amazing!"
  ];
  var CHEERS = [
    "Great job! You know your PIN!",
    "You did it! Awesome work!",
    "Perfect! You remembered your PIN!",
    "Woo hoo! Nice job!"
  ];

  function pick(arr)
  {
    return arr[(Math.random() * arr.length) | 0];
  }

  function getTarget()
  {
    try
    {
      var v = localStorage.getItem(STORE_KEY);
      if (v && /^[0-9]{6}$/.test(v))
      {
        return v;
      }
    }
    catch (e) {}
    return DEFAULT_PIN;
  }

  function setTarget(v)
  {
    try
    {
      localStorage.setItem(STORE_KEY, v);
      return true;
    }
    catch (e)
    {
      return false;
    }
  }

  function usingDefault()
  {
    try
    {
      return !localStorage.getItem(STORE_KEY);
    }
    catch (e)
    {
      return true;
    }
  }

  function buildDots()
  {
    dotsEl.innerHTML = "";
    for (var i = 0; i < LEN; i++)
    {
      var s = document.createElement("span");
      s.className = "dot";
      var num = document.createElement("b");
      num.className = "dot__num";
      s.appendChild(num);
      dotsEl.appendChild(s);
    }
  }

  function renderDots(state)
  {
    var nodes = dotsEl.children;
    for (var i = 0; i < nodes.length; i++)
    {
      var cls = "dot";
      if (i < entry.length)
      {
        cls += " dot--filled";
      }
      if (state)
      {
        cls += " dot--" + state;
      }
      nodes[i].className = cls;
    }
  }

  function setMessage(t)
  {
    if (peeking)
    {
      return;
    }
    msgEl.textContent = t || "";
  }

  function hint()
  {
    setMessage(usingDefault() ? "Parents: tap ⚙️ to set the PIN" : "");
  }

  function peekShow(e)
  {
    if (e && e.cancelable)
    {
      e.preventDefault();
    }
    peeking = true;
    var pin = getTarget();
    var nodes = dotsEl.children;
    for (var i = 0; i < nodes.length; i++)
    {
      var b = nodes[i].querySelector(".dot__num");
      if (b)
      {
        b.textContent = pin.charAt(i);
      }
    }
    dotsEl.classList.add("dots--peek");
  }

  function peekHide()
  {
    if (!peeking)
    {
      return;
    }
    peeking = false;
    dotsEl.classList.remove("dots--peek");
    hint();
  }

  function press(key)
  {
    if (locked)
    {
      return;
    }
    if (key === "back")
    {
      entry = entry.slice(0, -1);
      renderDots();
      if (!entry)
      {
        hint();
      }
      return;
    }
    if (key === "clear")
    {
      entry = "";
      renderDots();
      hint();
      return;
    }
    if (!/^[0-9]$/.test(key))
    {
      return;
    }
    if (entry.length >= LEN)
    {
      return;
    }
    entry += key;
    setMessage("");
    renderDots();
    if (entry.length === LEN)
    {
      evaluate();
    }
  }

  function evaluate()
  {
    if (entry === getTarget())
    {
      win();
    }
    else
    {
      fail();
    }
  }

  function fail()
  {
    locked = true;
    renderDots("wrong");
    dotsEl.classList.add("shake");
    setMessage("Almost! Try again 💪");
    window.setTimeout(function ()
    {
      dotsEl.classList.remove("shake");
      entry = "";
      renderDots();
      hint();
      locked = false;
    }, 850);
  }

  function win()
  {
    locked = true;
    renderDots("win");
    celebrateLine.textContent = pick(WIN_LINES);
    celebrateEl.hidden = false;
    launchConfetti();
    window.setTimeout(launchConfetti, 450);
    happySound();
    cheer();
  }

  function reset()
  {
    entry = "";
    locked = false;
    celebrateEl.hidden = true;
    renderDots();
    hint();
  }

  /* ---------- confetti ---------- */
  var cv = document.getElementById("confetti");
  var cx = cv.getContext("2d");
  var pieces = [];
  var rafId = 0;
  var COLORS = ["#f94144", "#f3722c", "#f8961e", "#f9c74f", "#90be6d",
                "#43aa8b", "#577590", "#ef476f", "#06d6a0", "#118ab2"];

  function sizeCanvas()
  {
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.floor(window.innerWidth * dpr);
    cv.height = Math.floor(window.innerHeight * dpr);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function makePiece()
  {
    return {
      x: Math.random() * window.innerWidth,
      y: -20 - Math.random() * (window.innerHeight * 0.6),
      w: 8 + Math.random() * 7,
      h: 10 + Math.random() * 9,
      vx: -2.4 + Math.random() * 4.8,
      vy: 2 + Math.random() * 4,
      rot: Math.random() * Math.PI,
      vr: -0.22 + Math.random() * 0.44,
      color: COLORS[(Math.random() * COLORS.length) | 0]
    };
  }

  function launchConfetti()
  {
    sizeCanvas();
    for (var i = 0; i < 150; i++)
    {
      pieces.push(makePiece());
    }
    if (!rafId)
    {
      rafId = window.requestAnimationFrame(tick);
    }
  }

  function tick()
  {
    cx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (var i = pieces.length - 1; i >= 0; i--)
    {
      var p = pieces[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.06;
      p.rot += p.vr;
      cx.save();
      cx.translate(p.x, p.y);
      cx.rotate(p.rot);
      cx.fillStyle = p.color;
      cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cx.restore();
      if (p.y > window.innerHeight + 40)
      {
        pieces.splice(i, 1);
      }
    }
    if (pieces.length === 0)
    {
      cx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      rafId = 0;
      return;
    }
    rafId = window.requestAnimationFrame(tick);
  }

  /* ---------- sound + speech ---------- */
  function happySound()
  {
    try
    {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC)
      {
        return;
      }
      var ac = new AC();
      var notes = [523.25, 659.25, 783.99, 1046.5];
      for (var i = 0; i < notes.length; i++)
      {
        var osc = ac.createOscillator();
        var gain = ac.createGain();
        osc.type = "triangle";
        osc.frequency.value = notes[i];
        var t = ac.currentTime + i * 0.12;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.28, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.start(t);
        osc.stop(t + 0.4);
      }
      window.setTimeout(function ()
      {
        try { ac.close(); } catch (e) {}
      }, 1600);
    }
    catch (e) {}
  }

  function cheer()
  {
    try
    {
      if (!("speechSynthesis" in window))
      {
        return;
      }
      var u = new SpeechSynthesisUtterance(pick(CHEERS));
      u.rate = 1;
      u.pitch = 1.25;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }
    catch (e) {}
  }

  /* ---------- settings ---------- */
  function digitsOnly(el)
  {
    el.value = el.value.replace(/[^0-9]/g, "").slice(0, 6);
  }

  function openSettings()
  {
    pinInput.value = "";
    pinConfirm.value = "";
    settingsMsg.textContent = "";
    settingsMsg.removeAttribute("data-ok");
    settingsEl.hidden = false;
    window.setTimeout(function () { pinInput.focus(); }, 50);
  }

  function closeSettings()
  {
    settingsEl.hidden = true;
  }

  function saveSettings()
  {
    var a = pinInput.value.trim();
    var b = pinConfirm.value.trim();
    settingsMsg.removeAttribute("data-ok");
    if (!/^[0-9]{6}$/.test(a))
    {
      settingsMsg.textContent = "PIN must be exactly 6 digits.";
      return;
    }
    if (a !== b)
    {
      settingsMsg.textContent = "The two PINs do not match.";
      return;
    }
    if (!setTarget(a))
    {
      settingsMsg.textContent = "Could not save on this device.";
      return;
    }
    closeSettings();
    reset();
    setMessage("New PIN saved — time to practice!");
    window.setTimeout(hint, 2600);
  }

  /* ---------- wiring ---------- */
  keypadEl.addEventListener("click", function (e)
  {
    var btn = e.target.closest(".key");
    if (btn)
    {
      press(btn.getAttribute("data-key"));
    }
  });

  restartBtn.addEventListener("click", reset);
  againBtn.addEventListener("click", reset);

  hintBtn.addEventListener("pointerdown", peekShow);
  hintBtn.addEventListener("pointerup", peekHide);
  hintBtn.addEventListener("pointerleave", peekHide);
  hintBtn.addEventListener("pointercancel", peekHide);
  hintBtn.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("blur", peekHide);
  settingsBtn.addEventListener("click", openSettings);
  settingsCancel.addEventListener("click", closeSettings);
  settingsSave.addEventListener("click", saveSettings);

  settingsEl.addEventListener("click", function (e)
  {
    if (e.target === settingsEl)
    {
      closeSettings();
    }
  });

  pinInput.addEventListener("input", function () { digitsOnly(pinInput); });
  pinConfirm.addEventListener("input", function () { digitsOnly(pinConfirm); });
  pinConfirm.addEventListener("keydown", function (e)
  {
    if (e.key === "Enter")
    {
      saveSettings();
    }
  });

  document.addEventListener("keydown", function (e)
  {
    if (!settingsEl.hidden)
    {
      if (e.key === "Escape")
      {
        closeSettings();
      }
      return;
    }
    if (!celebrateEl.hidden)
    {
      if (e.key === "Enter" || e.key === " ")
      {
        reset();
      }
      return;
    }
    if (/^[0-9]$/.test(e.key))
    {
      press(e.key);
    }
    else if (e.key === "Backspace")
    {
      press("back");
    }
    else if (e.key === "Escape")
    {
      press("clear");
    }
  });

  window.addEventListener("resize", function ()
  {
    if (rafId)
    {
      sizeCanvas();
    }
  });

  buildDots();
  renderDots();
  hint();
})();
</script>
</body>
</html>
