<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>PIN Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root
  {
    --bg: #ffffff;
    --ink: #2b2b3d;
    --muted: #8a8aa0;
    --card: #ffffff;
    --key-border: #e6e6ef;
    --key-shadow: #dcdce8;
    --accent: #2f9e6e;
    --accent-ink: #ffffff;
    --wrong: #e2574c;
    --focus: #3b82c4;
    --title: #1d7fd6;
    --font-fun: "Baloo 2", "Fredoka", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body
  {
    margin: 0;
    min-height: 100%;
  }

  body
  {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-fun);
    -webkit-font-smoothing: antialiased;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    overflow-x: hidden;
    overflow-y: auto;
  }

  #confetti
  {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9999;
  }

  .app
  {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 2.6vh, 30px);
    padding: clamp(12px, 3vh, 36px) clamp(14px, 4vw, 24px) calc(env(safe-area-inset-bottom, 0px) + clamp(12px, 3vh, 28px));
    max-width: 460px;
    margin: 0 auto;
  }

  .panel
  {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2.4vh, 26px);
  }

  header
  {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  h1
  {
    margin: 0;
    font-size: clamp(1.6rem, 6.5vw, 2.1rem);
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--title);
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.08);
  }

  .icon-btn
  {
    appearance: none;
    border: 2px solid var(--key-border);
    background: var(--card);
    color: var(--ink);
    width: 52px;
    height: 52px;
    border-radius: 16px;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 3px 0 var(--key-shadow);
  }

  .icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-shadow); }

  .dots
  {
    display: flex;
    gap: clamp(10px, 3vw, 18px);
    padding: 6px 0;
  }

  .dot
  {
    position: relative;
    width: clamp(20px, 6vw, 30px);
    height: clamp(20px, 6vw, 30px);
    border-radius: 50%;
    border: 3px solid var(--key-border);
    background: transparent;
    transition: transform 120ms ease, background-color 120ms ease, border-color 120ms ease;
  }

  .dot__num
  {
    position: absolute;
    top: calc(100% + 22px);
    left: 50%;
    transform: translateX(-50%);
    font-weight: 800;
    font-size: clamp(1.2rem, 6vw, 1.7rem);
    line-height: 1;
    color: var(--ink);
    opacity: 0;
    pointer-events: none;
    transition: opacity 120ms ease;
  }

  .dots--peek .dot__num { opacity: 1; }

  .dot--filled { background: var(--ink); border-color: var(--ink); transform: scale(1.05); }
  .dot--win.dot--filled { background: var(--accent); border-color: var(--accent); }
  .dot--wrong.dot--filled { background: var(--wrong); border-color: var(--wrong); }

  .shake { animation: shake 0.45s ease; }

  @keyframes shake
  {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .message
  {
    margin: 0;
    min-height: 1.4em;
    font-size: clamp(1rem, 4vw, 1.2rem);
    font-weight: 700;
    color: var(--muted);
    text-align: center;
    transition: color 120ms ease, font-size 120ms ease, letter-spacing 120ms ease;
  }


  .keypad
  {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(10px, 2.6vw, 16px);
    width: 100%;
  }

  .key
  {
    appearance: none;
    border: none;
    background: var(--kc, var(--card));
    color: #fff;
    font-family: inherit;
    font-weight: 800;
    font-size: clamp(1.9rem, 7.5vw, 2.8rem);
    aspect-ratio: 1 / 1;
    border-radius: 24px;
    cursor: pointer;
    touch-action: manipulation;
    text-shadow: 0 0 3px rgba(0, 0, 0, 0.28), 0 2px 0 rgba(0, 0, 0, 0.22);
    box-shadow: 0 6px 0 rgba(0, 0, 0, 0.20), 0 9px 16px rgba(0, 0, 0, 0.12);
    transition: transform 90ms ease, box-shadow 90ms ease, filter 90ms ease;
  }

  .key:active
  {
    transform: translateY(5px) scale(0.97);
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.22);
    filter: brightness(1.12) saturate(1.1);
  }

  .key--action
  {
    background: var(--card);
    color: var(--muted);
    font-weight: 800;
    font-size: clamp(1rem, 4.4vw, 1.4rem);
    text-shadow: none;
    border: 2px solid var(--key-border);
    box-shadow: 0 5px 0 var(--key-shadow);
  }

  .key--action:active { filter: none; background: #f3ffe9; }

  @keyframes keyPop
  {
    0% { transform: translateY(0) scale(1); }
    25% { transform: translateY(4px) scale(0.9); }
    55% { transform: translateY(-7px) scale(1.09); }
    100% { transform: translateY(0) scale(1); }
  }

  .key--pop { animation: keyPop 320ms ease; }

  .echo
  {
    position: fixed;
    left: 50%;
    top: 34%;
    transform: translate(-50%, -50%) scale(0.4);
    font-family: inherit;
    font-weight: 800;
    font-size: clamp(5rem, 32vw, 13rem);
    line-height: 1;
    color: var(--accent);
    opacity: 0;
    pointer-events: none;
    z-index: 8000;
    text-shadow: 0 8px 0 rgba(0, 0, 0, 0.12);
  }

  .echo--go { animation: echoPop 560ms ease forwards; }

  @keyframes echoPop
  {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4) rotate(-10deg); }
    28% { opacity: 1; transform: translate(-50%, -50%) scale(1.12) rotate(5deg); }
    60% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
  }

  .restart
  {
    appearance: none;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: inherit;
    font-weight: 800;
    font-size: clamp(1.05rem, 4.5vw, 1.3rem);
    padding: 16px 28px;
    border-radius: 999px;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 5px 0 #24805a;
  }

  .restart:active { transform: translateY(3px); box-shadow: 0 2px 0 #24805a; }

  .restart--ghost
  {
    background: transparent;
    color: var(--muted);
    box-shadow: none;
    font-size: 1rem;
    padding: 8px 16px;
  }

  .restart--ghost:active { transform: none; }

  .footer-actions
  {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .peek-btn
  {
    appearance: none;
    border: none;
    font-family: inherit;
    font-weight: 800;
    font-size: clamp(1rem, 4.4vw, 1.2rem);
    color: #5a3d00;
    background: #ffd23f;
    padding: 12px 22px;
    border-radius: 999px;
    cursor: pointer;
    touch-action: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 5px 0 #d9a100, 0 8px 14px rgba(0, 0, 0, 0.14);
    transition: transform 90ms ease, box-shadow 90ms ease, filter 90ms ease;
  }

  .peek-btn .peek-eye { font-size: 1.25em; line-height: 1; }

  .peek-btn:active
  {
    transform: translateY(4px) scale(0.96) rotate(-2deg);
    box-shadow: 0 1px 0 #d9a100;
    filter: brightness(1.05);
  }

  .peek-btn.is-peeking
  {
    background: #ffdf6b;
    animation: peekWiggle 480ms ease-in-out infinite;
  }

  @keyframes peekWiggle
  {
    0%, 100% { transform: translateY(4px) scale(1) rotate(-3deg); }
    50% { transform: translateY(4px) scale(1.04) rotate(3deg); }
  }

  [hidden] { display: none !important; }

  /* Celebration overlay */
  .celebrate
  {
    position: fixed;
    inset: 0;
    z-index: 9000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(255, 247, 236, 0.82);
    backdrop-filter: blur(2px);
  }

  .celebrate__card
  {
    background: var(--card);
    border: 3px solid var(--key-border);
    border-radius: 28px;
    padding: 30px 28px;
    text-align: center;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(36, 49, 77, 0.18);
    animation: pop 0.4s cubic-bezier(0.18, 1.4, 0.4, 1);
  }

  @keyframes pop
  {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .celebrate__emoji
  {
    font-size: 4rem;
    line-height: 1;
    animation: bounce 0.9s ease infinite alternate;
  }

  @keyframes bounce
  {
    from { transform: translateY(0) rotate(-6deg); }
    to { transform: translateY(-14px) rotate(6deg); }
  }

  .celebrate__card h2
  {
    margin: 12px 0 4px;
    font-size: 1.9rem;
    color: var(--accent);
    letter-spacing: 0.5px;
  }

  .celebrate__card p
  {
    margin: 0 0 22px;
    font-size: 1.15rem;
    color: var(--muted);
    font-weight: 700;
  }

  /* Settings modal */
  .modal
  {
    position: fixed;
    inset: 0;
    z-index: 9500;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(36, 49, 77, 0.45);
  }

  .modal__card
  {
    background: var(--card);
    border-radius: 24px;
    padding: 26px 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
  }

  .modal__card h2 { margin: 0 0 6px; font-size: 1.4rem; }

  .modal__card > p
  {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 0.98rem;
    line-height: 1.4;
    font-weight: 600;
  }

  .modal label
  {
    display: block;
    font-weight: 800;
    font-size: 0.95rem;
    margin-bottom: 14px;
  }

  .modal input
  {
    display: block;
    width: 100%;
    margin-top: 6px;
    font-family: inherit;
    font-size: 1.7rem;
    font-weight: 800;
    letter-spacing: 0.4em;
    text-align: center;
    padding: 12px 10px;
    border: 2px solid var(--key-border);
    border-radius: 14px;
    background: #ffffff;
    color: #10192e;
    -webkit-text-fill-color: #10192e;
    caret-color: #10192e;
  }

  .modal input::placeholder
  {
    color: #9aa4c0;
    -webkit-text-fill-color: #9aa4c0;
  }

  .modal input:focus
  {
    outline: 3px solid var(--focus);
    outline-offset: 1px;
    border-color: var(--focus);
  }

  .settings-msg
  {
    min-height: 1.3em;
    margin: 4px 0 14px;
    color: var(--wrong);
    font-weight: 700;
    font-size: 0.95rem;
  }

  .settings-msg[data-ok="1"] { color: var(--accent); }

  .modal__actions
  {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
  }

  .btn
  {
    appearance: none;
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-weight: 800;
    font-size: 1rem;
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
    touch-action: manipulation;
  }

  .btn--ghost
  {
    background: transparent;
    color: var(--muted);
    border: 2px solid var(--key-border);
  }

  .btn:active { transform: translateY(2px); }

  @media (prefers-color-scheme: dark)
  {
    :root
    {
      --bg: #1b1b24;
      --ink: #f1f1f8;
      --muted: #a6a6bd;
      --card: #2a2a38;
      --key-border: #3c3c4e;
      --key-shadow: #131319;
      --focus: #6ea8e0;
      --title: #63b3f2;
    }
    .key--action:active { background: #3a3157; }
    .celebrate { background: rgba(29, 35, 51, 0.85); }
  }

  /* Portrait phones: cap key height off the viewport so all four rows
     plus the header/dots/footer always fit on screen, instead of the
     square keys ballooning on tall devices and shoving the bottom row
     under the gesture bar. */
  @media (max-width: 520px)
  {
    .key
    {
      aspect-ratio: auto;
      height: clamp(54px, 11vh, 92px);
      font-size: clamp(1.7rem, 8vw, 2.4rem);
      border-radius: 20px;
    }

    .key--action { font-size: clamp(0.95rem, 4.4vw, 1.25rem); }
    .keypad { gap: clamp(9px, 2.4vw, 14px); }

    h1 { font-size: clamp(1.35rem, 6.5vw, 1.8rem); }
    .icon-btn { width: 46px; height: 46px; font-size: 1.35rem; }
    .dot { width: clamp(18px, 5vw, 26px); height: clamp(18px, 5vw, 26px); }
    .message { font-size: clamp(0.95rem, 4vw, 1.1rem); }
  }

  /* Short landscape (phones held sideways): two columns so the whole
     thing fits without scrolling. Tablets stay in the tall single
     column - they have the height for it. */
  @media (orientation: landscape) and (max-height: 600px)
  {
    body { overflow-y: auto; }

    .app
    {
      flex-flow: row wrap;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 4vw, 44px);
      max-width: 860px;
      padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px);
    }

    .panel
    {
      order: 1;
      width: auto;
      flex: 0 1 260px;
      gap: clamp(8px, 2.2vh, 16px);
    }

    h1 { font-size: clamp(1.15rem, 5vh, 1.5rem); }
    .icon-btn { width: 44px; height: 44px; font-size: 1.25rem; }

    #keypad
    {
      order: 2;
      width: min(48vw, 340px);
      gap: clamp(6px, 1.6vh, 12px);
    }

    .key
    {
      aspect-ratio: auto;
      height: clamp(40px, 12.5vh, 64px);
      font-size: clamp(1.3rem, 6vh, 2rem);
      border-radius: 16px;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.22);
    }

    .key:active { box-shadow: 0 1px 0 rgba(0, 0, 0, 0.22); }
    .key--action { font-size: clamp(0.8rem, 3.4vh, 1.1rem); box-shadow: 0 4px 0 var(--key-shadow); }
    .echo { font-size: clamp(4rem, 22vh, 9rem); top: 44%; }

    .dot { width: clamp(15px, 3.4vh, 22px); height: clamp(15px, 3.4vh, 22px); }
    .dot__num { top: calc(100% + 12px); font-size: clamp(1rem, 4.6vh, 1.4rem); }
    .message { font-size: 0.9rem; min-height: 1.1em; }

    .footer-actions
    {
      order: 3;
      flex-basis: 100%;
      gap: 8px;
    }

    .restart--ghost { font-size: 0.9rem; padding: 6px 12px; }
    .peek-btn { font-size: 0.95rem; padding: 8px 16px; }

    .celebrate__card, .modal__card
    {
      max-height: 92vh;
      overflow-y: auto;
      padding: 18px 22px;
    }

    .celebrate__emoji { font-size: 2.6rem; }
    .celebrate__card h2 { font-size: 1.4rem; margin-top: 8px; }
    .celebrate__card p { font-size: 1rem; margin-bottom: 14px; }
  }

  @media (prefers-reduced-motion: reduce)
  {
    .key--pop, .echo--go, .celebrate__emoji, .celebrate__card, .peek-btn.is-peeking { animation: none !important; }
    .echo { opacity: 0 !important; }
  }
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<main class="app">
  <div class="panel">
    <header>
      <h1>PIN Practice</h1>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="Parent settings" title="Parent settings">&#9881;&#65039;</button>
    </header>

    <div id="dots" class="dots" role="img" aria-label="PIN entry progress"></div>
    <p id="message" class="message" aria-live="polite"></p>
  </div>

  <div id="echo" class="echo" aria-hidden="true"></div>

  <div id="keypad" class="keypad">
    <button class="key" type="button" data-key="1">1</button>
    <button class="key" type="button" data-key="2">2</button>
    <button class="key" type="button" data-key="3">3</button>
    <button class="key" type="button" data-key="4">4</button>
    <button class="key" type="button" data-key="5">5</button>
    <button class="key" type="button" data-key="6">6</button>
    <button class="key" type="button" data-key="7">7</button>
    <button class="key" type="button" data-key="8">8</button>
    <button class="key" type="button" data-key="9">9</button>
    <button class="key key--action" type="button" data-key="clear" aria-label="Clear all">Clear</button>
    <button class="key" type="button" data-key="0">0</button>
    <button class="key key--action" type="button" data-key="back" aria-label="Delete last digit">&#9003;</button>
  </div>

  <div class="footer-actions">
    <button id="hintBtn" class="peek-btn" type="button" aria-label="Hold to peek at the PIN"><span class="peek-eye" aria-hidden="true">👀</span> Peek</button>
    <button id="restartBtn" class="restart restart--ghost" type="button">Start over</button>
  </div>
</main>

<div id="celebrate" class="celebrate" hidden>
  <div class="celebrate__card">
    <div class="celebrate__emoji">&#127881;</div>
    <h2>YOU DID IT!</h2>
    <p id="celebrateLine">You know your PIN!</p>
    <button id="againBtn" class="restart" type="button">Practice Again</button>
  </div>
</div>

<div id="settings" class="modal" hidden>
  <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">Parent Settings</h2>
    <p>Set the 6-digit PIN your child should practice. It is stored only on this device and never shown here.</p>
    <label>New PIN
      <input id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="------">
    </label>
    <label>Confirm PIN
      <input id="pinConfirm" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="------">
    </label>
    <p id="settingsMsg" class="settings-msg" aria-live="polite"></p>
    <div class="modal__actions">
      <button id="settingsCancel" class="btn btn--ghost" type="button">Cancel</button>
      <button id="settingsSave" class="btn" type="button">Save PIN</button>
    </div>
  </div>
</div>

<script>
(function ()
{
  "use strict";

  var STORE_KEY = "pinPractice.target.v1";
  var DEFAULT_PIN = "123456";
  var LEN = 6;

  var dotsEl = document.getElementById("dots");
  var msgEl = document.getElementById("message");
  var echoEl = document.getElementById("echo");
  var keypadEl = document.getElementById("keypad");
  var restartBtn = document.getElementById("restartBtn");
  var hintBtn = document.getElementById("hintBtn");
  var celebrateEl = document.getElementById("celebrate");
  var celebrateLine = document.getElementById("celebrateLine");
  var againBtn = document.getElementById("againBtn");
  var settingsBtn = document.getElementById("settingsBtn");
  var settingsEl = document.getElementById("settings");
  var pinInput = document.getElementById("pinInput");
  var pinConfirm = document.getElementById("pinConfirm");
  var settingsMsg = document.getElementById("settingsMsg");
  var settingsSave = document.getElementById("settingsSave");
  var settingsCancel = document.getElementById("settingsCancel");

  var entry = "";
  var locked = false;
  var peeking = false;

  var DIGIT_COLORS = [
    "#ef4444", "#f97316", "#f59e0b", "#22c55e", "#14b8a6",
    "#3b82f6", "#8b5cf6", "#ec4899", "#06b6d4", "#65a30d"
  ];
  var NUM_WORDS = [
    "zero", "one", "two", "three", "four",
    "five", "six", "seven", "eight", "nine"
  ];

  var WIN_LINES = [
    "You know your PIN!",
    "You remembered every number!",
    "That was perfect!",
    "Your brain is amazing!"
  ];
  var CHEERS = [
    "Great job! You know your PIN!",
    "You did it! Awesome work!",
    "Perfect! You remembered your PIN!",
    "Woo hoo! Nice job!"
  ];

  function pick(arr)
  {
    return arr[(Math.random() * arr.length) | 0];
  }

  function getTarget()
  {
    try
    {
      var v = localStorage.getItem(STORE_KEY);
      if (v && /^[0-9]{6}$/.test(v))
      {
        return v;
      }
    }
    catch (e) {}
    return DEFAULT_PIN;
  }

  function setTarget(v)
  {
    try
    {
      localStorage.setItem(STORE_KEY, v);
      return true;
    }
    catch (e)
    {
      return false;
    }
  }

  function usingDefault()
  {
    try
    {
      return !localStorage.getItem(STORE_KEY);
    }
    catch (e)
    {
      return true;
    }
  }

  function buildDots()
  {
    dotsEl.innerHTML = "";
    for (var i = 0; i < LEN; i++)
    {
      var s = document.createElement("span");
      s.className = "dot";
      var num = document.createElement("b");
      num.className = "dot__num";
      s.appendChild(num);
      dotsEl.appendChild(s);
    }
  }

  function renderDots(state)
  {
    var nodes = dotsEl.children;
    for (var i = 0; i < nodes.length; i++)
    {
      var cls = "dot";
      if (i < entry.length)
      {
        cls += " dot--filled";
      }
      if (state)
      {
        cls += " dot--" + state;
      }
      nodes[i].className = cls;
    }
  }

  function setMessage(t)
  {
    if (peeking)
    {
      return;
    }
    msgEl.textContent = t || "";
  }

  function hint()
  {
    setMessage(usingDefault() ? "Parents: tap ⚙️ to set the PIN" : "");
  }

  function peekShow(e)
  {
    if (e && e.cancelable)
    {
      e.preventDefault();
    }
    peeking = true;
    var pin = getTarget();
    var nodes = dotsEl.children;
    for (var i = 0; i < nodes.length; i++)
    {
      var b = nodes[i].querySelector(".dot__num");
      if (b)
      {
        b.textContent = pin.charAt(i);
      }
    }
    dotsEl.classList.add("dots--peek");
    hintBtn.classList.add("is-peeking");
  }

  function peekHide()
  {
    if (!peeking)
    {
      return;
    }
    peeking = false;
    dotsEl.classList.remove("dots--peek");
    hintBtn.classList.remove("is-peeking");
    hint();
  }

  /* ---------- toddler feedback ---------- */
  var audioCtx = null;

  function ac()
  {
    try
    {
      if (!audioCtx)
      {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC)
        {
          audioCtx = new AC();
        }
      }
      if (audioCtx && audioCtx.state === "suspended")
      {
        audioCtx.resume();
      }
    }
    catch (e) {}
    return audioCtx;
  }

  function blip(digit)
  {
    var c = ac();
    if (!c)
    {
      return;
    }
    try
    {
      var osc = c.createOscillator();
      var gain = c.createGain();
      osc.type = "sine";
      osc.frequency.value = 330 + Number(digit) * 45;
      var t = c.currentTime;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(t);
      osc.stop(t + 0.24);
    }
    catch (e) {}
  }

  function sayDigit(digit)
  {
    try
    {
      if (!("speechSynthesis" in window))
      {
        return;
      }
      var word = NUM_WORDS[Number(digit)] || String(digit);
      var u = new SpeechSynthesisUtterance(word);
      u.rate = 0.95;
      u.pitch = 1.35;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }
    catch (e) {}
  }

  function bumpKey(key)
  {
    var b = keypadEl.querySelector('.key[data-key="' + key + '"]');
    if (!b)
    {
      return;
    }
    b.classList.remove("key--pop");
    void b.offsetWidth;
    b.classList.add("key--pop");
  }

  function echoDigit(digit)
  {
    echoEl.textContent = digit;
    echoEl.style.color = DIGIT_COLORS[Number(digit)] || "var(--accent)";
    echoEl.classList.remove("echo--go");
    void echoEl.offsetWidth;
    echoEl.classList.add("echo--go");
  }

  function press(key)
  {
    if (locked)
    {
      return;
    }
    if (key === "back")
    {
      bumpKey("back");
      entry = entry.slice(0, -1);
      renderDots();
      if (!entry)
      {
        hint();
      }
      return;
    }
    if (key === "clear")
    {
      bumpKey("clear");
      entry = "";
      renderDots();
      hint();
      return;
    }
    if (!/^[0-9]$/.test(key))
    {
      return;
    }
    bumpKey(key);
    if (entry.length >= LEN)
    {
      return;
    }
    entry += key;
    setMessage("");
    renderDots();
    echoDigit(key);
    sayDigit(key);
    blip(key);
    if (entry.length === LEN)
    {
      evaluate();
    }
  }

  function evaluate()
  {
    if (entry === getTarget())
    {
      win();
    }
    else
    {
      fail();
    }
  }

  function fail()
  {
    locked = true;
    renderDots("wrong");
    dotsEl.classList.add("shake");
    setMessage("Almost! Try again 💪");
    window.setTimeout(function ()
    {
      dotsEl.classList.remove("shake");
      entry = "";
      renderDots();
      hint();
      locked = false;
    }, 850);
  }

  function win()
  {
    locked = true;
    renderDots("win");
    celebrateLine.textContent = pick(WIN_LINES);
    celebrateEl.hidden = false;
    launchConfetti();
    window.setTimeout(launchConfetti, 450);
    happySound();
    cheer();
  }

  function reset()
  {
    entry = "";
    locked = false;
    celebrateEl.hidden = true;
    renderDots();
    hint();
  }

  /* ---------- confetti ---------- */
  var cv = document.getElementById("confetti");
  var cx = cv.getContext("2d");
  var pieces = [];
  var rafId = 0;
  var COLORS = ["#f94144", "#f3722c", "#f8961e", "#f9c74f", "#90be6d",
                "#43aa8b", "#577590", "#ef476f", "#06d6a0", "#118ab2"];

  function sizeCanvas()
  {
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.floor(window.innerWidth * dpr);
    cv.height = Math.floor(window.innerHeight * dpr);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function makePiece()
  {
    return {
      x: Math.random() * window.innerWidth,
      y: -20 - Math.random() * (window.innerHeight * 0.6),
      w: 8 + Math.random() * 7,
      h: 10 + Math.random() * 9,
      vx: -2.4 + Math.random() * 4.8,
      vy: 2 + Math.random() * 4,
      rot: Math.random() * Math.PI,
      vr: -0.22 + Math.random() * 0.44,
      color: COLORS[(Math.random() * COLORS.length) | 0]
    };
  }

  function launchConfetti()
  {
    sizeCanvas();
    for (var i = 0; i < 150; i++)
    {
      pieces.push(makePiece());
    }
    if (!rafId)
    {
      rafId = window.requestAnimationFrame(tick);
    }
  }

  function tick()
  {
    cx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (var i = pieces.length - 1; i >= 0; i--)
    {
      var p = pieces[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.06;
      p.rot += p.vr;
      cx.save();
      cx.translate(p.x, p.y);
      cx.rotate(p.rot);
      cx.fillStyle = p.color;
      cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cx.restore();
      if (p.y > window.innerHeight + 40)
      {
        pieces.splice(i, 1);
      }
    }
    if (pieces.length === 0)
    {
      cx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      rafId = 0;
      return;
    }
    rafId = window.requestAnimationFrame(tick);
  }

  /* ---------- sound + speech ---------- */
  function happySound()
  {
    try
    {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC)
      {
        return;
      }
      var ac = new AC();
      var notes = [523.25, 659.25, 783.99, 1046.5];
      for (var i = 0; i < notes.length; i++)
      {
        var osc = ac.createOscillator();
        var gain = ac.createGain();
        osc.type = "triangle";
        osc.frequency.value = notes[i];
        var t = ac.currentTime + i * 0.12;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.28, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.start(t);
        osc.stop(t + 0.4);
      }
      window.setTimeout(function ()
      {
        try { ac.close(); } catch (e) {}
      }, 1600);
    }
    catch (e) {}
  }

  function cheer()
  {
    try
    {
      if (!("speechSynthesis" in window))
      {
        return;
      }
      var u = new SpeechSynthesisUtterance(pick(CHEERS));
      u.rate = 1;
      u.pitch = 1.25;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }
    catch (e) {}
  }

  /* ---------- settings ---------- */
  function digitsOnly(el)
  {
    el.value = el.value.replace(/[^0-9]/g, "").slice(0, 6);
  }

  function openSettings()
  {
    pinInput.value = "";
    pinConfirm.value = "";
    settingsMsg.textContent = "";
    settingsMsg.removeAttribute("data-ok");
    settingsEl.hidden = false;
    window.setTimeout(function () { pinInput.focus(); }, 50);
  }

  function closeSettings()
  {
    settingsEl.hidden = true;
  }

  function saveSettings()
  {
    var a = pinInput.value.trim();
    var b = pinConfirm.value.trim();
    settingsMsg.removeAttribute("data-ok");
    if (!/^[0-9]{6}$/.test(a))
    {
      settingsMsg.textContent = "PIN must be exactly 6 digits.";
      return;
    }
    if (a !== b)
    {
      settingsMsg.textContent = "The two PINs do not match.";
      return;
    }
    if (!setTarget(a))
    {
      settingsMsg.textContent = "Could not save on this device.";
      return;
    }
    closeSettings();
    reset();
    setMessage("New PIN saved — time to practice!");
    window.setTimeout(hint, 2600);
  }

  /* ---------- wiring ---------- */
  keypadEl.addEventListener("click", function (e)
  {
    var btn = e.target.closest(".key");
    if (btn)
    {
      press(btn.getAttribute("data-key"));
    }
  });

  restartBtn.addEventListener("click", reset);
  againBtn.addEventListener("click", reset);

  hintBtn.addEventListener("pointerdown", peekShow);
  hintBtn.addEventListener("pointerup", peekHide);
  hintBtn.addEventListener("pointerleave", peekHide);
  hintBtn.addEventListener("pointercancel", peekHide);
  hintBtn.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("blur", peekHide);
  settingsBtn.addEventListener("click", openSettings);
  settingsCancel.addEventListener("click", closeSettings);
  settingsSave.addEventListener("click", saveSettings);

  settingsEl.addEventListener("click", function (e)
  {
    if (e.target === settingsEl)
    {
      closeSettings();
    }
  });

  pinInput.addEventListener("input", function () { digitsOnly(pinInput); });
  pinConfirm.addEventListener("input", function () { digitsOnly(pinConfirm); });
  pinConfirm.addEventListener("keydown", function (e)
  {
    if (e.key === "Enter")
    {
      saveSettings();
    }
  });

  document.addEventListener("keydown", function (e)
  {
    if (!settingsEl.hidden)
    {
      if (e.key === "Escape")
      {
        closeSettings();
      }
      return;
    }
    if (!celebrateEl.hidden)
    {
      if (e.key === "Enter" || e.key === " ")
      {
        reset();
      }
      return;
    }
    if (/^[0-9]$/.test(e.key))
    {
      press(e.key);
    }
    else if (e.key === "Backspace")
    {
      press("back");
    }
    else if (e.key === "Escape")
    {
      press("clear");
    }
  });

  window.addEventListener("resize", function ()
  {
    if (rafId)
    {
      sizeCanvas();
    }
  });

  function paintKeys()
  {
    var keys = keypadEl.querySelectorAll(".key[data-key]");
    for (var i = 0; i < keys.length; i++)
    {
      var k = keys[i].getAttribute("data-key");
      if (/^[0-9]$/.test(k))
      {
        keys[i].style.setProperty("--kc", DIGIT_COLORS[Number(k)]);
      }
    }
  }

  paintKeys();
  buildDots();
  renderDots();
  hint();
})();
</script>
</body>
</html>
